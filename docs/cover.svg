<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="70%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for Waveforms -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(51, 65, 85, 0.18)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="850" cy="240" r="300" fill="url(#glowCyan)" />
  <circle cx="400" cy="450" r="280" fill="url(#glowPurple)" />

  <!-- Ghost Take Waveform (Take 1 - Translucent Violet Dashed) -->
  <path d="M 50 480 Q 150 480 200 460 T 320 490 T 420 440 T 500 500 T 600 430 T 700 510 T 800 420 T 900 490 T 1000 450 T 1150 480"
        fill="none"
        stroke="url(#purpleLine)"
        stroke-width="3"
        stroke-dasharray="6,6" />

  <!-- Live Pulse PPG Waveform (Take 2 - Vibrant Neon Cyan with Glow) -->
  <path d="M 50 450 Q 180 450 240 440 T 340 450 T 400 430 T 430 380 T 450 490 T 470 410 T 510 450 T 620 450 T 680 430 T 710 370 T 730 500 T 750 410 T 790 450 T 900 450 T 960 430 T 990 380 T 1010 490 T 1030 410 T 1070 450 T 1150 450"
        fill="none"
        stroke="url(#cyanLine)"
        stroke-width="4.5"
        filter="url(#neonGlow)" />

  <!-- Lead Dot -->
  <circle cx="1070" cy="450" r="6" fill="#f0f9ff" filter="url(#neonGlow)" />

  <!-- Decorative Biometric Gauges (Right Side Cockpit) -->
  <g transform="translate(860, 80)">
    <!-- Glass card container -->
    <rect width="280" height="240" rx="20" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
    
    <!-- Circular Composure Gauge -->
    <circle cx="90" cy="110" r="55" fill="none" stroke="rgba(51, 65, 85, 0.4)" stroke-width="8" />
    <circle cx="90" cy="110" r="55" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="345" stroke-dashoffset="65" stroke-linecap="round" />
    <text x="90" y="106" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" text-anchor="middle">91%</text>
    <text x="90" y="126" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">COMPOSURE</text>

    <!-- Reticle target -->
    <g transform="translate(200, 110)">
      <circle cx="0" cy="0" r="40" fill="none" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.5" />
      <circle cx="0" cy="0" r="24" fill="none" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1.5" />
      <line x1="-48" y1="0" x2="48" y2="0" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
      <line x1="0" y1="-48" x2="0" y2="48" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
      <circle cx="2" cy="-2" r="5" fill="#818cf8" />
      <text x="0" y="58" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle">EYE CONTACT 88%</text>
    </g>

    <!-- Badge inside card -->
    <rect x="20" y="190" width="240" height="30" rx="8" fill="rgba(30, 27, 75, 0.8)" stroke="rgba(168, 85, 247, 0.4)" />
    <text x="140" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" text-anchor="middle">
      👻 Ghost Delta: -16 BPM | +28% Regulation
    </text>
  </g>

  <!-- Left Header Branding -->
  <g transform="translate(80, 110)">
    <!-- SmartSpectra Sponsor Badge -->
    <rect width="260" height="32" rx="16" fill="rgba(8, 47, 73, 0.8)" stroke="rgba(56, 189, 248, 0.4)" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7dd3fc" letter-spacing="0.5">
      PRESAGE SMARTSPECTRA SDK
    </text>

    <!-- Main Title -->
    <text x="0" y="115" font-family="system-ui, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Pitch<tspan fill="#38bdf8">Pulse</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#94a3b8">
      Contactless Biometric Presentation Coach
    </text>

    <!-- Highlights -->
    <text x="0" y="215" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#64748b">
      60 FPS Pulse &amp; Respiratory Oscilloscope  •  "Ghost Take" Comparative Pacing  •  100% Local Privacy
    </text>
  </g>

  <!-- Bottom Badges Bar -->
  <g transform="translate(80, 545)">
    <rect width="1040" height="42" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(51, 65, 85, 0.5)" />
    
    <text x="30" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">rPPG Arterial Pulse</text>
    <text x="180" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#475569">•</text>
    <text x="210" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a855f7">Autonomic HRV (RMSSD)</text>
    <text x="390" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#475569">•</text>
    <text x="420" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Talking-Gated Breathing</text>
    <text x="600" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#475569">•</text>
    <text x="630" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#818cf8">478-Landmark Eye Contact</text>
    <text x="830" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#475569">•</text>
    <text x="860" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">Speech Cadence</text>
  </g>
</svg>
